<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>終末地抽卡計算機 Endfield gacha calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: #f5f5f5;
        }

        /* 滾動條樣式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1f1f1f;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b3b3b;
            border-radius: 10px;
        }

            ::-webkit-scrollbar-thumb:hover {
                background: #555;
            }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Header */
        .header {
            margin-bottom: 2rem;
        }

            .header h1 {
                font-size: 2.5rem;
                font-weight: 700;
                background: linear-gradient(135deg, #3b82f6, #a855f7);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                display: inline-flex;
                align-items: center;
                gap: 0.75rem;
            }

                .header h1 svg {
                    color: #3b82f6;
                }
            .header h2 {
                font-size: 2rem;
                font-weight: 700;
                background: linear-gradient(135deg, #3b82f6, #a855f7);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                margin-top: 0;
                margin-bottom: 0.5rem;
            }
            .header p {
                font-size: 1.125rem;
                color: #a3a3a3;
                margin-top: 0.5rem;
            }

        /* 主網格 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* 卡片樣式 */
        .card {
            background: #121212;
            border-radius: 1.5rem;
            border: 1px solid #262626;
            padding: 1.75rem;
            transition: all 0.2s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            color: #e5e5e5;
        }

            .card-title svg {
                width: 1.25rem;
                height: 1.25rem;
                color: #737373;
            }

        /* 表單組 */
        .form-group {
            margin-bottom: 1.5rem;
        }

            .form-group label {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.875rem;
                font-weight: 500;
                color: #a3a3a3;
                margin-bottom: 0.5rem;
            }

            .form-group input {
                width: 100%;
                background: #0a0a0a;
                border: 1px solid #262626;
                border-radius: 0.75rem;
                padding: 0.75rem 1rem;
                color: #f5f5f5;
                font-size: 1rem;
                transition: all 0.2s;
            }

                .form-group input:focus {
                    outline: none;
                    border-color: #3b82f6;
                    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
                }
                /* 隱藏 number input 的增減箭頭 */
                .form-group input[type="number"] {
                    -moz-appearance: textfield;
                    appearance: textfield;
                }

                    .form-group input[type="number"]::-webkit-inner-spin-button,
                    .form-group input[type="number"]::-webkit-outer-spin-button {
                        -webkit-appearance: none;
                        margin: 0;
                        display: none;
                    }

        .hint {
            font-size: 0.875rem;
            font-weight: 500;
            color: #a3a3a3;
        }

        /* Banner 列表 */
        .banners-list {
            margin-top: 1rem;
        }

        .banner-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .banner-label {
            width: 5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #a3a3a3;
        }

        .banner-item input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 0.75rem;
            padding: 0.7rem 1rem;
            color: #f5f5f5;
            font-size: 0.95rem;
        }
            /* 隱藏 banner input 的增減箭頭 */
            .banner-item input[type="number"] {
                -moz-appearance: textfield;
                appearance: textfield;
            }

                .banner-item input[type="number"]::-webkit-inner-spin-button,
                .banner-item input[type="number"]::-webkit-outer-spin-button {
                    -webkit-appearance: none;
                    margin: 0;
                    display: none;
                }

            .banner-item input:focus {
                outline: none;
                border-color: #3b82f6;
            }

        .calculate-btn {
            width: 100%;
            margin-top: 1.5rem;
            background: #3b82f6;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.875rem;
            border-radius: 1rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

            .calculate-btn:hover:not(:disabled) {
                background: #2563eb;
                transform: translateY(-1px);
            }

            .calculate-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        /* 結果卡片 */
        .result-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

            .result-card::before {
                content: '';
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at 30% 50%, rgba(59,130,246,0.08), rgba(168,85,247,0.05));
                pointer-events: none;
            }

        .result-label {
            font-size: 1rem;
            font-weight: 500;
            color: #a3a3a3;
            margin-bottom: 1rem;
        }

        .result-value {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .result-sub {
            font-size: 0.875rem;
            font-weight: 500;
            color: #a3a3a3;
            margin-top: 0.75rem;
        }

        .placeholder-text {
            color: #2c2c2c;
            font-size: 1.125rem;
        }

        /* 分隔線 */
        .divider {
            border-top: 1px solid #262626;
            margin: 1.5rem 0;
        }

        /* 動畫 */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* 固定卡池提示 */
        .fixed-hint {
            text-align: center;
            font-size: 0.75rem;
            color: #3b82f6;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid #262626;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                終末地抽卡計算機
            </h1>
            <h2>Arknights:Endfield gacha probability calculator</h2>
        </div>

        <div class="main-grid">
            <!-- 左側：輸入區 -->
            <div class="card">
                <div class="card-title">
                    Current State (當前情況)
                </div>

                <div class="form-group">
                    <label>                        
                        Initial Pity (墊幾抽) (0~79)
                    </label>
                    <input type="text" id="initialPity" placeholder="0" value="0">               
                </div>

                <div class="form-group">
                    <label>                
                        Budget (預算) (0~5000)
                    </label>
                    <input type="text" id="budget" placeholder="0" value="0">
                </div>

                <div class="divider"></div>

                <div class="card-title">
                    Banner Targets (目標數量)
                </div>
                <div class="hint" style="margin-bottom: 1rem;">valid number (輸入範圍): 0~6</div>

                <div id="bannerContainer" class="banners-list"></div>

                <button id="calculateBtn" class="calculate-btn">
                    Calculate Probability (計算結果)
                </button>
            </div>

            <!-- 右側：結果區 -->
            <div class="card result-card">
                <div class="result-label">Success Probability (成功率)</div>
                <div id="resultDisplay" class="placeholder-text" style="color: #525252;">點擊計算查看結果</div>
                <div id="resultSub" class="result-sub" style="margin-top: 0.5rem;"></div>
            </div>
        </div>
    </div>

    <script>
        // 固定 5 個卡池
        const BANNER_COUNT = 5;
        let banners = [0, 0, 0, 0, 0];  // 預設全為 0

        // 輸入上限常量
        const PITY_MIN = 0;
        const PITY_MAX = 79;
        const BUDGET_MIN = 0;
        const BUDGET_MAX = 5000;
        const TARGET_MIN = 0;
        const TARGET_MAX = 6;

        // WASM 函數
        let calculateFunc = null;
        let calculateSingleFunc = null;

        // DOM 元素
        const bannerContainer = document.getElementById('bannerContainer');
        const calculateBtn = document.getElementById('calculateBtn');
        const initialPityInput = document.getElementById('initialPity');
        const budgetInput = document.getElementById('budget');
        const resultDisplay = document.getElementById('resultDisplay');
        const resultSub = document.getElementById('resultSub');

        // 限制輸入值在範圍內
        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        // 獲取有效的數字值（空格視為 0）
        function getValidNumber(input, min, max) {
            let val = input.value.trim();
            if (val === "") return 0;
            let num = parseInt(val);
            if (isNaN(num)) return 0;
            return clamp(num, min, max);
        }

        // 處理初始保底輸入
        function handlePityInput() {
            let val = getValidNumber(initialPityInput, PITY_MIN, PITY_MAX);
            initialPityInput.value = val === 0 ? "" : val;
        }

        // 處理預算輸入
        function handleBudgetInput() {
            let val = getValidNumber(budgetInput, BUDGET_MIN, BUDGET_MAX);
            budgetInput.value = val === 0 ? "" : val;
        }

        // 處理目標數量輸入
        function handleTargetInput(input, idx) {
            let val = input.value.trim();
            let num;
            if (val === "") {
                num = 0;
            } else {
                num = parseInt(val);
                if (isNaN(num)) num = 0;
                num = clamp(num, TARGET_MIN, TARGET_MAX);
            }
            input.value = num === 0 ? "" : num;
            if (idx >= 0 && idx < banners.length) {
                banners[idx] = num;
            }
        }

        // 渲染卡池列表 (固定數量)
        function renderBanners() {
            bannerContainer.innerHTML = '';
            for (let i = 0; i < BANNER_COUNT; i++) {
                const target = banners[i] !== undefined ? banners[i] : 0;
                const div = document.createElement('div');
                div.className = 'banner-item';
                div.innerHTML = `
                    <span class="banner-label">Banner ${i + 1}</span>
                    <input type="text" value="${target === 0 ? "" : target}" placeholder="0" data-index="${i}" class="banner-input">
                `;
                bannerContainer.appendChild(div);
            }

            // 綁定輸入事件
            document.querySelectorAll('.banner-input').forEach(input => {
                input.addEventListener('input', function() {
                    const idx = parseInt(this.dataset.index);
                    let val = this.value.trim();
                    let num;
                    if (val === "") {
                        num = 0;
                    } else {
                        num = parseInt(val);
                        if (isNaN(num)) {
                            this.value = "";
                            num = 0;
                        } else {
                            num = clamp(num, TARGET_MIN, TARGET_MAX);
                            this.value = num === 0 ? "" : num;
                        }
                    }
                    if (idx >= 0 && idx < banners.length) {
                        banners[idx] = num;
                    }
                });
                input.addEventListener('blur', function() {
                    const idx = parseInt(this.dataset.index);
                    handleTargetInput(this, idx);
                });
            });
        }

        // 更新結果顯示
        function updateResult(prob) {
            const percent = (Math.min(1, prob) * 100).toFixed(5);
            resultDisplay.innerHTML = `<div class="result-value">${percent}%</div>`;
            resultSub.innerHTML = `You have ${percent}% chance to get your target.`;
        }

        function showLoading() {
            calculateBtn.disabled = true;
            calculateBtn.innerHTML = `計算中...`;
            resultDisplay.innerHTML = '<div class="placeholder-text" style="color: #525252;">計算中...</div>';
            resultSub.innerHTML = '';
        }

        function hideLoading() {
            calculateBtn.disabled = false;
            calculateBtn.innerHTML = `Calculate Probability (計算結果)`;
        }

        function showError(msg) {
            resultDisplay.innerHTML = `<div class="placeholder-text" style="color: #ef4444;">${msg}</div>`;
            resultSub.innerHTML = '';
        }

        // 多池計算
        function calculateMulti() {
            if (!calculateFunc) {
                showError('WASM 尚未加載完成，請稍後再試');
                return;
            }

            // 獲取輸入值（空格視為 0）
            const initialPity = getValidNumber(initialPityInput, PITY_MIN, PITY_MAX);
            const initialBudget = getValidNumber(budgetInput, BUDGET_MIN, BUDGET_MAX);
            const targets = banners.map(b => b);

            showLoading();

            setTimeout(() => {
                try {
                    const targetArray = new Int32Array(targets);
                    const ptr = Module._malloc(targetArray.length * 4);

                    for (let i = 0; i < targetArray.length; i++) {
                        Module.setValue(ptr + i * 4, targetArray[i], 'i32');
                    }

                    const result = calculateFunc(ptr, targetArray.length, initialPity, initialBudget);
                    Module._free(ptr);

                    updateResult(result);
                } catch (e) {
                    console.error(e);
                    showError('計算錯誤: ' + e.message);
                } finally {
                    hideLoading();
                }
            }, 50);
        }

        // 初始化 WASM
        function initWasm() {
            if (typeof Module !== 'undefined' && Module.cwrap) {
                calculateFunc = Module.cwrap('calculate', 'number', ['number', 'number', 'number', 'number']);
                calculateSingleFunc = Module.cwrap('calculateSingle', 'number', ['number', 'number', 'number']);

                console.log('✅ WASM 加載成功');
                calculateBtn.disabled = false;
                resultDisplay.innerHTML = '<div class="placeholder-text" style="color: #525252;">點擊計算查看結果</div>';
            } else {
                setTimeout(initWasm, 100);
            }
        }

        // 綁定事件
        calculateBtn.addEventListener('click', calculateMulti);
        
        // 綁定輸入事件
        initialPityInput.addEventListener('input', handlePityInput);
        initialPityInput.addEventListener('blur', handlePityInput);
        budgetInput.addEventListener('input', handleBudgetInput);
        budgetInput.addEventListener('blur', handleBudgetInput);

        // 初始狀態
        renderBanners();
        calculateBtn.disabled = true;

        // 啟動 WASM 加載
        setTimeout(initWasm, 500);
    </script>
    <script src="gacha.js"></script>
</body>
</html>
