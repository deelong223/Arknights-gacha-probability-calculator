<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06060a">
<meta name="description" content="《明日方舟：終末地》特許尋訪機率計算機 — 多期目標、保底水位、120 大保底、情報書與 240 信物全部納入計算。">
<title>終末地抽卡計算機 · Arknights: Endfield Gacha Calculator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">🎲</span>
      <span>
        <span data-i18n="app.title">終末地抽卡計算機</span>
        <small data-i18n="app.tagline">Arknights: Endfield · 特許尋訪機率</small>
      </span>
    </div>
    <nav>
      <button id="rulesBtn" class="btn" type="button">
        <span aria-hidden="true">📖</span><span data-i18n="nav.rules">抽卡規則</span>
      </button>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="zh-TW" aria-pressed="true">繁</button>
        <button type="button" data-lang="zh-CN" aria-pressed="false">简</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </nav>
  </header>

  <main>
    <div class="grid">
      <!-- ---------------------------------------------------- 輸入 -->
      <section class="card" aria-labelledby="inputTitle">
        <header>
          <span aria-hidden="true">🎛️</span>
          <h2 id="inputTitle" data-i18n="panel.input">條件設定</h2>
          <button id="resetBtn" class="btn icon" type="button" style="margin-left:auto">
            <span aria-hidden="true">↺</span><span data-i18n="btn.reset">重設</span>
          </button>
        </header>

        <div class="row3">
          <div class="field">
            <label for="pity"><span aria-hidden="true">🎯</span><span data-i18n="label.pity">目前保底水位</span></label>
            <input id="pity" type="text" inputmode="numeric" value="0">
            <p class="hint" data-i18n="hint.pity">0–79：連續幾抽沒出 6★</p>
          </div>
          <div class="field">
            <label for="budget"><span aria-hidden="true">💎</span><span data-i18n="label.budget">可用抽數</span></label>
            <input id="budget" type="text" inputmode="numeric" value="120">
            <p class="hint" data-i18n="hint.budget">0–5000</p>
          </div>
          <div class="field">
            <label for="threshold"><span aria-hidden="true">⚙️</span><span data-i18n="label.threshold">續抽門檻</span></label>
            <input id="threshold" type="text" inputmode="numeric" value="47">
            <p class="hint" data-i18n="hint.threshold">達標後若已抽 ≥ 此抽數，就補到 60 抽賺情報書</p>
          </div>
        </div>

        <div class="field">
          <label><span aria-hidden="true">🧩</span><span data-i18n="label.targets">各期目標張數</span></label>
          <div id="banners" class="banners"></div>
          <p class="hint" data-i18n="hint.targets">0 = 跳過該期、1 = 只要一張、最多 6</p>
        </div>

        <button id="calcBtn" class="btn primary" type="button" style="width:100%">
          <span aria-hidden="true">✨</span><span data-i18n="btn.calculate">計算機率</span>
        </button>
      </section>

      <!-- ---------------------------------------------------- 結果 -->
      <section class="card result-card" aria-labelledby="resultTitle">
        <header style="width:100%">
          <span aria-hidden="true">🏆</span>
          <h2 id="resultTitle" data-i18n="panel.result">成功率</h2>
        </header>

        <div class="result-body">
        <div id="gauge" class="gauge">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#8ec0ff"/>
                <stop offset="55%" stop-color="#b99cff"/>
                <stop offset="100%" stop-color="#8ff2dc"/>
              </linearGradient>
            </defs>
            <circle class="track" cx="100" cy="100" r="88"></circle>
            <circle id="gaugeBar" class="bar" cx="100" cy="100" r="88"
                    transform="rotate(-90 100 100)" style="stroke-dasharray:553;stroke-dashoffset:553"></circle>
          </svg>
          <div class="value">
            <b id="gaugeValue">—</b>
            <small data-i18n="result.caption">達成全部目標的機率</small>
          </div>
          <div id="sparkles" class="sparkles" aria-hidden="true"></div>
        </div>

        <p id="resultSummary" class="result-summary">—</p>
        </div>
      </section>
    </div>

    <!-- ---------------------------------------------------- 統計 -->
    <section class="card" style="margin-top:1.1rem" aria-labelledby="statsTitle">
      <header>
        <span aria-hidden="true">📊</span>
        <h2 id="statsTitle" data-i18n="stats.title">統計</h2>
        <span id="statsSub" class="tag"></span>
      </header>
      <div id="stats" class="stats"></div>
    </section>

    <!-- ---------------------------------------------------- 圖表 -->
    <section class="card" style="margin-top:1.1rem">
      <div class="charts">
        <div>
          <div class="chart-head">
            <h3 data-i18n="chart.curve.title">成功率累積曲線</h3>
            <p data-i18n="chart.curve.desc">橫軸抽數 · 縱軸達成全部目標的機率（可點擊圖表調整預算）</p>
          </div>
          <div id="curveBox" class="chart-box"></div>
        </div>
        <div>
          <div class="chart-head">
            <h3 data-i18n="chart.cost.title">各期達標抽數</h3>
            <p data-i18n="chart.cost.desc">長條為中位數、橫線為 P10–P90、白點為平均</p>
          </div>
          <div id="costBox" class="chart-box"></div>
        </div>
      </div>
    </section>

    <!-- ---------------------------------------------------- 分享 -->
    <section id="shareCard" class="card" style="margin-top:1.1rem" hidden>
      <header>
        <span aria-hidden="true">🔗</span>
        <h2 data-i18n="share.title">分享</h2>
      </header>
      <div class="share-row">
        <button id="copyTextBtn" class="btn" type="button">
          <span aria-hidden="true">📋</span><span data-i18n="share.copyText">複製結果</span>
        </button>
        <button id="copyImageBtn" class="btn" type="button">
          <span aria-hidden="true">🖼️</span><span data-i18n="share.copyImage">複製圖片</span>
        </button>
        <button id="downloadBtn" class="btn" type="button">
          <span aria-hidden="true">💾</span><span data-i18n="share.download">下載 PNG</span>
        </button>
        <button id="copyLinkBtn" class="btn" type="button">
          <span aria-hidden="true">🔗</span><span data-i18n="share.copyLink">複製連結</span>
        </button>
      </div>
    </section>

    <footer class="footer">
      <span data-i18n="footer.credit">非官方工具 · 機率為數學模型推算，僅供參考</span>
      <a href="https://github.com/deelong223/Arknights-gacha-probability-calculator" target="_blank" rel="noopener">
        <span aria-hidden="true">⭐</span> GitHub
      </a>
    </footer>
  </main>
</div>

<!-- ---------------------------------------------------- 規則彈窗 -->
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="rulesTitle">
  <div class="modal-panel">
    <header>
      <span aria-hidden="true">📖</span>
      <h2 id="rulesTitle" data-i18n="rules.title">抽卡規則</h2>
      <button id="rulesClose" class="btn icon" type="button">
        <span aria-hidden="true">✕</span><span data-i18n="rules.close">關閉</span>
      </button>
    </header>
    <div id="rulesBody"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 可選：若連得到 CDN，就用 Twemoji 的彩色 emoji 圖檔；連不到就沿用系統 emoji -->
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"
        onerror="window.__twemojiFailed=true"></script>
<script src="gacha-wasm-b64.js"></script>
<script src="i18n.js"></script>
<script src="gacha.js"></script>
<script src="charts.js"></script>
<script src="share.js"></script>
<script src="app.js"></script>
</body>
</html>
